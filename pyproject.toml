[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-swarm"
version = "0.1.0"
description = "Autonomous customer support and ticket resolution swarm"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
sqlite = ["aiosqlite>=0.20"]
redis = ["redis>=5.0"]
llm = ["litellm>=1.44"]
# CrewAI does not support Python 3.14 yet (every release caps at <3.14), so
# the marker keeps `pip install .[crewai]` from hard-failing there. The
# orchestrator raises a clear error if you select it without the package.
crewai = ["crewai>=0.60; python_version < '3.14'"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "aiosqlite>=0.20",
  "ruff>=0.6",
]
# Everything needed to run the service for real.
server = [
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "litellm>=1.44",
]

[project.scripts]
support-swarm = "support_swarm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/support_swarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:support_swarm.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI dependency injection uses calls in defaults
  "RUF012",  # mutable class attrs are fine on pydantic models
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# These two modules are tables of regex literals. Wrapping a pattern across
# lines to satisfy a column limit makes it harder to read and easier to break,
# so the limit is waived here rather than fought.
"src/support_swarm/core/injection.py" = ["E501"]
"src/support_swarm/agents/intents.py" = ["E501"]
